[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
user=root

[program:flask]
command=gunicorn --workers 1 --threads 2 --max-requests 100 --max-requests-jitter 20 --timeout 120 --bind 0.0.0.0:%(ENV_PORT)s Main:app
directory=/app/CyberAttackPrediction
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
startsecs=5
stopwaitsecs=10

[program:error-bus]
command=/usr/local/bin/error-bus
directory=/app/CyberAttackPrediction
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
startsecs=3
stopwaitsecs=5